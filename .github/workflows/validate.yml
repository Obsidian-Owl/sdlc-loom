name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Envelope YAML is syntactically valid
        run: npx --yes yaml-lint envelopes/*.yml
      - name: Required top-level keys present in every envelope
        run: |
          for f in envelopes/*.yml; do
            for key in envelope shape modelPolicy skills decision; do
              grep -q "^${key}:" "$f" || { echo "::error file=$f::missing required key '$key'"; exit 1; }
            done
          done
      - name: No orphaned skillPath entries (source repos must be reachable)
        run: |
          for f in envelopes/*.yml; do
            grep -oP '(?<=source: ).*' "$f" | sort -u | while read -r repo; do
              [ -z "$repo" ] && continue
              curl -sfI "https://github.com/$repo" > /dev/null || { echo "::error file=$f::unreachable source repo '$repo'"; exit 1; }
            done
          done

  dsh-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @deepseek-ai/dsh
      - name: Every profile composes without error (structural check, no credential required)
        run: |
          for env in research design plan build verify ship operate; do
            echo "=== $env ==="
            DSH_HOME=$(mktemp -d)
            DSH_HOME="$DSH_HOME" dsh --profile web \
              --patch dsh/host-patches/llm-pi-ai.cordis.yml \
              --patch "dsh/profiles/$env.cordis.yml" \
              --dump-config > "/tmp/dump-$env.txt"
          done
      # Composing cleanly is not sufficient — issue #7 was exactly a case that
      # passed this check while being silently wrong at runtime. This step
      # catches the specific, previously-real failure mode: a profile's
      # persona/model-route content not actually present in the composed
      # tree, which is at least a necessary (if not sufficient) condition for
      # it being live. It cannot replace the manual live-call verification
      # documented in docs/model-routing.md — see MAINTENANCE.md for why a
      # full live-credential CI smoke test remains a deferred, heavier fix.
      - name: Composed output actually contains each profile's distinguishing content
        run: |
          declare -A NEEDLE=(
            [research]="You research"
            [design]="you evaluate whether to build"
            [plan]="dependency-ordered work items"
            [verify]="You verify. You do not repair"
            [ship]="You ship"
            [operate]="You observe production"
          )
          for env in research design plan verify ship operate; do
            grep -qi "${NEEDLE[$env]}" "/tmp/dump-$env.txt" || { echo "::error::$env's composed config does not contain its expected persona text"; exit 1; }
          done
