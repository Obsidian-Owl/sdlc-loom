# Verified working pattern, live-tested 2026-09-18 — see docs/model-routing.md
# for the full story of why this shape, not a per-preset override.
#
# `agent-default-model` is a HOST-PLANE singleton: it only takes effect set
# here, at the root, alongside `llm-pi-ai` and `agent-presets`. A copy of this
# row placed *inside* a preset's own agent.cordis.yml composes without error
# but is silently inert — confirmed by direct test, not assumed. That's the
# real shape of the bug tracked as sdlc-loom#1.
#
# Practical consequence: model TIER is a profile concern, not a preset
# concern. This file is the "frontier" tier — for research/design/plan.
# See cheap.cordis.yml for the build/verify/ship/operate counterpart. Combine
# whichever tier you want with whichever preset via `agent-presets.default`
# in the same patch (or a sibling one) — the two are independent axes.
#
# Usage: dsh --profile headless --patch dsh/host-patches/llm-pi-ai.cordis.yml \
#          --patch dsh/profiles/frontier.cordis.yml "<task>"

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: dashscope   # the route KEY from llm-pi-ai.cordis.yml, not "pi-ai"
    model: qwen3.8-max
