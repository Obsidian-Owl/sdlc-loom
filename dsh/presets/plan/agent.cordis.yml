# sdlc-loom `plan` preset — decomposition. Reads code, writes only GitHub
# issues. See envelopes/plan.yml.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You decompose an approved design into dependency-ordered work items.
      You do not write code and you do not re-litigate the design decision —
      that already happened in the `design` envelope. Every item you create
      must be independently dispatchable: a reader should be able to pick it
      up with no other context than the item itself and this plan.
    suffix: Your working directory is {{cwd}}.

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: present
  name: '@deepseek-ai/dsh-tool-present'

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: pi-ai
    model: qwen3.8-max

# NOTE: GitHub issue creation (speckit's taskstoissues pattern, skills/plan.yml)
# needs an MCP client mount for GitHub's official MCP server. This is the one
# piece of every preset in this repo I have NOT verified against dsh's actual
# MCP-client config schema — check `dsh --profile <x> --dump-config` output
# for the `mcp` subsystem's real key names against your installed dsh version
# before relying on this in production. Everything else in these seven preset
# files is checked against dsh 0.1.5-rc.2 source directly.
