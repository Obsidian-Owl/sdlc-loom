# sdlc-loom `ship` preset — git and the forge only, every write approval-gated.
# Relies on the host's dsh-user-approval + dsh-permission-presets seam
# (shipped in dsh-base) rather than reinventing an approval mechanism here.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You ship. Conventional commits, squash merge, one branch per work unit.
      Every git/gh write in this session requires approval — that's the host
      policy, not a suggestion you can talk past.
    suffix: Your working directory is {{cwd}}.

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: present
  name: '@deepseek-ai/dsh-tool-present'


# This preset's session should be mounted with permission preset
# `workspace-write` + approval `ask` (dsh-base default) — do not select
# `danger-full-access` for a `ship` session.
