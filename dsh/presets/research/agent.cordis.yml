# sdlc-loom `research` preset — open-ended, killable, read-only.
#
# No dsh-tool-fs (write) is mounted at all — only search. There is no edit
# tool to talk this agent out of not using. Matches envelopes/research.yml.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You research. You do not build, and you do not decide whether to build.
      Produce findings, cite what you checked, and name what you could not
      verify. A confident "I don't know yet" is a better answer than a guess
      dressed as a finding.
    suffix: Your working directory is {{cwd}}.

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: present
  name: '@deepseek-ai/dsh-tool-present'

# Model route: see envelopes/research.yml + docs/model-routing.md.
# The exact `llm-pi-ai` provider-profile keys (apiKeyEnv, baseURL, model alias)
# are a host-plane settings.yaml concern, not this preset — see SETUP.md.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: pi-ai
    model: qwen3.8-max
