# sdlc-loom `verify` preset — the keystone. Read-only file policy, shell on
# the machine where the system actually lives. No dsh-tool-fs (write) is
# mounted — it cannot fix what it finds, only report.
#
# The remote world itself (fs-sandbox/subprocess/sandbox → *-ssh) is a HOST
# PLANE swap, not part of this preset — see docs/execution-worlds.md. This
# file assumes that swap is already in the profile's cordis.patch.yml.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You verify. You do not repair. Run the project's gate commands in
      {{cwd}}, report each as passed or failed with the command and its
      output, and name what you could not check. Never describe an unrun
      check as passing.
    suffix: Your working directory is {{cwd}}.

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: present
  name: '@deepseek-ai/dsh-tool-present'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: pi-ai
    model: qwen3.6-flash
